# Version preparation is reviewed in a PR. Only an existing tag on main
# starts a candidate build; this workflow never pushes main or publishes a release.
name: Prepare verified release draft
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
  packages: write
  id-token: write
  attestations: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate reviewed release tag and signing gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$GITHUB_REF_TYPE" = tag
          node scripts/check-release.mjs "$GITHUB_REF_NAME"
          node scripts/check-signing-environment.mjs
          node scripts/ensure-draft-release.mjs "$GITHUB_REF_NAME"
  desktop:
    needs: preflight
    uses: ./.github/workflows/macos-release.yml
    secrets: inherit
  docker:
    needs: preflight
    uses: ./.github/workflows/docker-publish.yml
    secrets: inherit
  verify-draft:
    needs: [desktop, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Build updater signature verifier
        run: cargo build --locked --manifest-path scripts/verify-updater/Cargo.toml
      - name: Require both DMGs and both update feeds on the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-release-assets.mjs "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence
          path: release-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Record promotion instructions
        run: |
          echo 'Candidate checks passed. The release remains a draft.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Complete docs/RELEASING.md signed-install, update and recovery checks before publishing these exact assets.' >> "$GITHUB_STEP_SUMMARY"
