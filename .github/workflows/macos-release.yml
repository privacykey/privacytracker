name: macOS desktop release

on:
  workflow_call:
    inputs:
      backend:
        description: 'Which backend the app ships: rust (the app serves itself) or node (the bundled sidecar, kept for rollback until v0.3.0 has shipped).'
        required: false
        default: rust
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag matching Run workflow ref (e.g. v0.3.0).'
        required: true
        type: string
      dry_run:
        description: 'If true, build and sign but skip notarization + release upload.'
        required: false
        default: false
        type: boolean
      backend:
        description: 'Which backend the app ships.'
        required: false
        default: rust
        type: choice
        options:
          - rust
          - node

env:
  # Node 24 LTS ("Krypton"), active-LTS channel through Apr 2028.
  # Must match the sidecar Node version packaged into src-tauri/binaries/
  # so better-sqlite3's native ABI lines up — see comments further down.
  # The `rust` backend ships no Node, so its leg builds under .nvmrc
  # instead and this pin does not apply to it.
  NODE_VERSION: '24.20.0'
  # rust since the desktop cutover; node builds the sidecar release, kept
  # for a rollback until v0.3.0 has shipped. Every Node-only step below is gated on this,
  # and the verifier is told which bundle it is looking at.
  BACKEND: ${{ inputs.backend || 'rust' }}

permissions:
  actions: read
  # Needed so tauri-action can upload artifacts to the draft release.
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag, draft and signing approval gate before accessing secrets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          test "$GITHUB_REF_TYPE" = tag
          test "$REQUESTED_TAG" = "$GITHUB_REF_NAME"
          node scripts/check-release.mjs "$GITHUB_REF_NAME"
          node scripts/check-signing-environment.mjs
          if [ "$RELEASE_DRY_RUN" != 1 ]; then node scripts/ensure-draft-release.mjs "$GITHUB_REF_NAME"; fi

  build-and-sign:
    name: Build ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    # Generous ceiling — notarization waits are outside our control — but
    # still far below the 6h default, so a hung run can't eat the runner
    # budget all day.
    timeout-minutes: 120
    # Environment-scoped secrets + required reviewer gate. Runs won't start
    # the signing step until you approve in the Actions UI.
    environment: macos-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners keep Next.js and the shipped SQLite addon on the same architecture.
          - os: macos-15
            target: aarch64-apple-darwin
            node_arch: arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            node_arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        # No explicit version: the action reads `packageManager` from
        # package.json, the single source of truth.
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6

      - name: Install Node (node backend)
        if: ${{ env.BACKEND == 'node' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          # Deliberately NOT `node-version-file: .nvmrc` (major-only): the
          # build Node must be the exact sidecar version pinned in
          # NODE_VERSION at the top of this file so better-sqlite3's
          # native ABI lines up with the bundled runtime.
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Node (rust backend)
        if: ${{ env.BACKEND == 'rust' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          # Nothing of Node ships in this build, so nothing constrains the
          # version beyond what the repository asks for: Node only builds
          # the frontend here, and the app serves it with SQLite compiled
          # into the binary.
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Rust toolchain (${{ matrix.target }})
        # Pinned to a SHA, not the `stable` branch — a branch ref is a
        # particularly weak supply-chain link (anyone with push access
        # to dtolnay/rust-toolchain could redirect every consumer's
        # workflow in seconds). Dependabot's github-actions ecosystem
        # will open a PR when this should be rolled forward.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable as of 2026-05
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          # Compiled crates only: a bundle is a build's output, never an input.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            !src-tauri/target/*/release/bundle
          key: cargo-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: |
            cargo-${{ matrix.target }}-

      # A cache saved before the bundle directory was excluded above still
      # holds the app, DMG and app tar of whichever run saved it (a dry
      # run's, say). tauri-action tars the app only when no tar exists, so
      # it would upload that stale one to the draft. The upload step below
      # removes tauri-action's tar anyway, but everything under bundle/
      # must come from this run.
      - name: Remove bundles restored from the cache
        env:
          TARGET: ${{ matrix.target }}
        run: rm -rf "src-tauri/target/$TARGET/release/bundle"

      - name: Install JS dependencies
        env:
          EXPECTED_ARCH: ${{ matrix.node_arch }}
        run: |
          node -e 'if (process.arch !== process.env.EXPECTED_ARCH) throw new Error("Wrong runner architecture")'
          pnpm install --frozen-lockfile

      - name: Check the native SQLite addon loads
        # Only the node backend ships better-sqlite3; the rust one compiles
        # SQLite into the binary, so this check has nothing to say about it.
        if: ${{ env.BACKEND == 'node' }}
        run: node -e 'const db = require("better-sqlite3") (":memory:"); db.close()'

      # Fetch the exact Node binary we ship as a sidecar. Must match the
      # NODE_MODULE_VERSION that `better-sqlite3` was installed against in
      # the step above — pinning NODE_VERSION at the top of this file and
      # passing it through here guarantees the match.
      #
      # The script GPG-verifies against the Node.js release-team signing
      # keys, THEN hash-verifies against the now-trusted SHASUMS256.txt
      # before extraction. The bundled binary lands inside the signed +
      # notarised app, so a compromise of the nodejs.org distribution host
      # (or any TLS-MITM the GitHub runner walks into) would otherwise
      # propagate a tampered Node into every privacytracker auto-update.
      # Notarisation / Gatekeeper only verify the cert chain — they don't
      # know what bytes Node was supposed to be. The detached
      # SHASUMS256.txt.sig closes the gap a bare hash check left open: an
      # attacker who can swap the tarball can equally swap SHASUMS256.txt,
      # but cannot forge a Node release-team signature over it.
      #
      # This used to be ~40 lines of inline shell with its own copy of the
      # release-key fingerprints. It shares `scripts/fetch-node-sidecar.sh`
      # with local desktop builds now, so the key list has exactly one home
      # (in that script) and cannot drift between here and a dev machine.
      # TAURI_BUILD_TARGET is the same variable stage-standalone.mjs reads
      # when it picks which binary to wrap, so both halves stay in step.
      - name: Download + verify bundled Node ${{ env.NODE_VERSION }} (${{ matrix.node_arch }})
        if: ${{ env.BACKEND == 'node' }}
        env:
          # NODE_VERSION comes from the workflow-level `env:` block.
          TAURI_BUILD_TARGET: ${{ matrix.target }}
        run: bash scripts/fetch-node-sidecar.sh

      # Set up a dedicated signing keychain so the staging script
      # below can codesign Mach-O binaries inside standalone.tar
      # BEFORE the tarball gets sealed into the .app bundle.
      # tauri-action sets up its own (separate) keychain for signing
      # the outer .app, but it does so after `beforeBuildCommand`
      # fires — too late to help us sign the contents we need to ship
      # inside the tar. Two keychains on the search list co-exist
      # cleanly; the cleanup step at the bottom removes ours.
      - name: Set up staging signing keychain
        # Only the node backend needs it: it exists so stage-standalone.mjs
        # can codesign the Mach-O files it puts inside standalone.tar. The
        # rust backend stages a directory of pages and assets, none of which
        # is code, and tauri-action's own keychain signs the app.
        if: ${{ env.BACKEND == 'node' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASS="$(openssl rand -base64 24)"
          KEYCHAIN_PATH="${RUNNER_TEMP}/staging.keychain-db"
          CERT_PATH="${RUNNER_TEMP}/staging-cert.p12"
          # Stash the path + password for later step env (and cleanup).
          echo "STAGING_KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> "$GITHUB_ENV"
          echo "::add-mask::${KEYCHAIN_PASS}"
          echo "STAGING_KEYCHAIN_PASS=${KEYCHAIN_PASS}" >> "$GITHUB_ENV"
          umask 077
          printf '%s' "${APPLE_CERTIFICATE}" | base64 --decode > "${CERT_PATH}"
          security create-keychain -p "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -A -t cert -f pkcs12 \
            -k "${KEYCHAIN_PATH}"
          # Append our keychain to the user search list so codesign
          # finds the cert without us having to pass --keychain everywhere.
          keychains=()
          while IFS= read -r keychain; do keychains+=("$keychain"); done < <(security list-keychain -d user | sed 's/^ *"//; s/"$//')
          security list-keychain -d user -s "${KEYCHAIN_PATH}" "${keychains[@]}"
          # Permit codesign / productsign to access the private key
          # without the interactive password prompt that runs would
          # block on.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"
          rm -f "${CERT_PATH}"
          # Sanity-check: the identity must be visible to codesign
          # right now, otherwise the staging step below will fail
          # with the same "item could not be found in the keychain"
          # the previous attempt died on.
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}"

      - name: Stage Next.js standalone bundle
        # TAURI_BUILD_TARGET tells scripts/stage-standalone.mjs which
        # Node binary to drop into the .node-helper.app bundle that
        # ships inside standalone.tar. Each leg builds on a runner of its
        # own architecture (macos-15-intel for x86_64), so the target and
        # the host agree today; naming the target explicitly keeps the
        # Intel .app from ever carrying an arm64 Node if a leg is moved to
        # another runner.
        #
        # APPLE_SIGNING_IDENTITY is the trigger for the codesign pass
        # inside stage-standalone.mjs — without it the script prunes
        # but does not sign, leaving notarytool to reject every
        # surviving .node / .dylib inside standalone.tar.
        if: ${{ env.BACKEND == 'node' }}
        env:
          TAURI_BUILD_TARGET: ${{ matrix.target }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: pnpm build:standalone

      # The rust backend's equivalent, and far less: the frontend the app
      # serves, staged as a directory inside the bundle. No Node, no
      # tarball, nothing to codesign (scripts/stage-site.mjs refuses to
      # stage anything but pages, assets and the CSP hashes). The tauri
      # build below runs the same two commands through the overlay's
      # beforeBuildCommand; doing it here as well keeps the failure close
      # to its cause when a build is broken.
      - name: Build and stage the frontend and notices
        if: ${{ env.BACKEND == 'rust' }}
        run: |
          pnpm build
          pnpm stage:site
          pnpm stage:notices

      # Materialise the App Store Connect API key (.p8) to disk. The secret
      # stores the file *contents*; notarytool needs a file path. We write
      # it with mode 600 into $RUNNER_TEMP and delete it in the cleanup
      # step regardless of outcome. The runner VM is destroyed at job end
      # anyway, so this is belt-and-braces.
      - name: Write App Store Connect API key
        if: ${{ !inputs.dry_run }}
        id: write-api-key
        run: |
          set -euo pipefail
          p8_path="${RUNNER_TEMP}/appstoreconnect.p8"
          umask 077
          printf '%s' "${APPLE_API_KEY}" > "${p8_path}"
          echo "p8_path=${p8_path}" >> "$GITHUB_OUTPUT"
        env:
          # The full .p8 file contents (multi-line PEM).
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}

      # The Tauri action handles:
      #   • Decoding APPLE_CERTIFICATE (base64 p12) into a temporary keychain
      #   • Running `tauri build --target ${{ matrix.target }}`
      #   • Invoking notarytool with the App Store Connect API key creds
      #   • Stapling the notarization ticket onto the .app and .dmg
      #   • Uploading the DMG to the draft release (see `tagName` /
      #     `releaseName` below), along with its own tar of the .app. That
      #     tar is not the updater archive: the steps after verification
      #     pack that from the verified bundle, sign it and put it in the
      #     draft in its place.
      - name: Build, sign, notarize, and upload
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f  # action-v1.0.0
        env:
          # --- GitHub Release upload ---
          # tauri-action attaches the signed .dmg / .app.tar.gz to a
          # draft release after notarization. The auto-provided
          # GITHUB_TOKEN (scoped by the workflow's permissions: block
          # above — contents: write) is enough; no PAT needed. Without
          # this thread-through the action gets all the way through
          # build + sign + notarize and then fails the job with
          # `GITHUB_TOKEN is required`, leaving you with notarized
          # artefacts that the runner discards on cleanup. Run
          # #26036804294 hit exactly that wall.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # --- Apple Developer ID (signing) ---
          # APPLE_CERTIFICATE is the base64 of your Developer ID Application
          # p12 export. APPLE_SIGNING_IDENTITY is the human string that
          # appears in Keychain Access next to the cert, e.g.
          #   "Developer ID Application: Your Name (ABCD123456)"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

          # --- App Store Connect API key (notarization) ---
          # Preferred path for CI — revocable from App Store Connect with
          # one click and unaffected by Apple ID 2FA prompts. The legacy
          # APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID vars are also honoured
          # by notarytool if you'd rather use an app-specific password.
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ steps.write-api-key.outputs.p8_path }}

          # --- Tauri updater signing (ed25519): deliberately absent ---
          # The build creates no updater artifacts (tauri.conf.json leaves
          # bundle.createUpdaterArtifacts off), so it needs no updater key,
          # and keeping the key out of this step keeps it away from every
          # build script the frontend build runs. Only "Pack, sign and
          # record the updater archive" below holds it, and it signs only
          # an archive it packed from the verified bundle.

          RELEASE_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}

          # --- Build target awareness ---
          # tauri-action runs `tauri build --target ${{ matrix.target }}`
          # which invokes the beforeBuildCommand (pnpm build:standalone on
          # the node backend), which calls scripts/stage-standalone.mjs.
          # The staging script picks the bundled Node binary based on
          # TAURI_BUILD_TARGET rather than the host arch (see the comment
          # in that script). This export keeps the explicit-stage step
          # (above) and the tauri-action's implicit re-run consistent.
          TAURI_BUILD_TARGET: ${{ matrix.target }}

          # --- Skip the redundant beforeBuildCommand re-stage ---
          # stage-standalone has already run once above (in the
          # explicit "Stage Next.js standalone bundle" step) with our
          # staging keychain on the search list, which is where the
          # codesign pass on every .node / .dylib inside standalone.tar
          # actually succeeds. tauri-action's keychain isn't visible to
          # codesign at the moment beforeBuildCommand fires inside
          # `tauri build`, so without this guard the second run would
          # wipe the pre-signed tarball and die on the codesign call.
          # See the matching `STANDALONE_PRE_BUILT === '1'` early-exit
          # in scripts/stage-standalone.mjs. The rust backend has no
          # pre-signed tarball to protect: its beforeBuildCommand only
          # rebuilds and re-stages the frontend, which costs nothing to
          # repeat and keeps the bundle's contents a function of the build
          # that produced it.
          STANDALONE_PRE_BUILT: ${{ env.BACKEND == 'node' && '1' || '' }}
        with:
          # `pnpm tauri` without the trailing `--`. pnpm 11.0.x silently
          # stripped a trailing `--` separator before running the script;
          # 11.1.x passes it through, so the CLI saw a literal `--` as
          # its first positional arg and Clap rejected `build` as
          # "unexpected argument" (see commit message). Either form is
          # equivalent for arg forwarding — pnpm already passes the
          # action's `build --target …` straight through to the script.
          tauriScript: node scripts/run-release-tauri.mjs
          # The rust backend adds three things: the cargo feature, the
          # config overlay that bundles the staged site and swaps in the
          # stricter entitlements, and `--no-default-features` for cargo
          # AFTER the separator — the tauri CLI rejects it before one.
          args: ${{ env.BACKEND == 'rust' && format('--target {0} --features rust-backend --config src-tauri/tauri.rust.conf.json -- --no-default-features', matrix.target) || format('--target {0}', matrix.target) }}
          # Draft release keyed on the git tag. On tag push, GITHUB_REF_NAME
          # is the tag (e.g. v0.1.0). On workflow_dispatch, use the input.
          tagName: ${{ !inputs.dry_run && github.ref_name || '' }}
          releaseName: ${{ !inputs.dry_run && format('privacytracker {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadWorkflowArtifacts: true
          # Don't upload a per-leg latest.json — each matrix leg would
          # otherwise overwrite the previous one with a single-platform
          # manifest, so whichever arch finishes second wins and the
          # other platform's signature is dropped. The `assemble-latest-json`
          # job below merges both legs' .sig payloads into one manifest
          # that lists every platform we ship.
          #
          # These two inputs replace v0's single `includeUpdaterJson`,
          # which action-v1.0.0 removed. BOTH default to `true`, so
          # leaving them out would silently restore the exact clobbering
          # this block exists to prevent — and because GitHub only
          # *warns* about unknown inputs, the old key would have kept
          # "working" right up until a release shipped a broken manifest.
          uploadUpdaterJson: false
          # v1 split .sig upload out of the manifest flag. v0 suppressed
          # both together. The release carries no .sig file at all: the
          # signature of the archive packed below goes into the feed.
          uploadUpdaterSignatures: false

      - name: Verify bundled application and notarization
        env:
          TARGET: ${{ matrix.target }}
          NODE_ARCH: ${{ matrix.node_arch }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/verify-macos-bundle.mjs "src-tauri/target/$TARGET/release/bundle/macos/privacytracker.app" "$NODE_ARCH" "$BACKEND"

      # The updater archive is the one thing the release signs with the
      # updater key, so it is packed here from the bundle the step above
      # verified, never taken from the draft: anything able to write to the
      # draft could otherwise choose the bytes that key signs. The script
      # checks the archive holds that same signed app and nothing else,
      # signs it, checks the signature against the public key the shipped
      # app trusts and records the archive's SHA-256 in build-evidence.json.
      # A dry run does all of this too, so a rehearsal exercises the signing.
      - name: Build updater signature verifier
        run: cargo build --locked --manifest-path scripts/verify-updater/Cargo.toml

      - name: Pack, sign and record the updater archive
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/stage-updater-archive.mjs "$RELEASE_TAG" "$TARGET" "src-tauri/target/$TARGET/release/bundle/macos/privacytracker.app" "updater-stage/$TARGET"

      # Put that archive on the draft under the name the update feed uses,
      # replacing any other updater archive for this platform (tauri-action
      # uploads its own tar of the app), and read it back. The assemble job
      # and the release's draft check compare the draft with the recorded
      # digest again, and stop on any difference.
      - name: Upload the verified updater archive to the draft
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/upload-updater-archive.mjs "$RELEASE_TAG" "$TARGET" "updater-stage/$TARGET"

      # Also on a dry run: the rehearsal's signed archive and its evidence
      # can be inspected, though its app is not notarised.
      - name: Upload updater payload artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: updater-${{ matrix.target }}
          path: updater-stage/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7

      # Always runs — even if the signing step failed — so private key
      # material doesn't survive one second longer than it has to. The
      # runner VM is destroyed after the job completes anyway, but this
      # protects against a mid-run `actions/upload-artifact` accidentally
      # grabbing the file if a future edit adds one.
      - name: Clean up signing material
        if: always()
        run: |
          rm -f "${{ steps.write-api-key.outputs.p8_path }}" 2>/dev/null || true
          security delete-keychain build.keychain 2>/dev/null || true
          # Our staging keychain (set up early in the job to let
          # stage-standalone.mjs codesign Mach-O binaries inside
          # standalone.tar before tar). Best-effort delete; the runner
          # VM is destroyed at job-end anyway.
          if [ -n "${STAGING_KEYCHAIN_PATH:-}" ] && [ -f "${STAGING_KEYCHAIN_PATH}" ]; then
            security delete-keychain "${STAGING_KEYCHAIN_PATH}" 2>/dev/null || true
            rm -f "${STAGING_KEYCHAIN_PATH}" 2>/dev/null || true
          fi

  assemble-latest-json:
    name: Verify and assemble both update feeds
    needs: build-and-sign
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Build updater signature verifier
        run: cargo build --locked --manifest-path scripts/verify-updater/Cargo.toml
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: updater
          pattern: updater-*
      # assemble-updater.mjs refuses an artifact or draft archive whose
      # digest differs from the one its build job recorded, before it
      # verifies a signature or writes a feed.
      - name: Verify archives against the build evidence, preserve legacy feed and assemble latest-v2.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/ensure-draft-release.mjs "$GITHUB_REF_NAME"
          node scripts/assemble-updater.mjs "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" latest.json latest-v2.json --clobber
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-update-feeds
          path: |
            latest.json
            latest-v2.json
          if-no-files-found: error
