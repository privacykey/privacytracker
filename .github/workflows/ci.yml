name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # pnpm needs to be installed before setup-node so that the latter's
      # cache: 'pnpm' resolver can locate the pnpm binary on PATH. No
      # explicit version here: the action reads `packageManager` from
      # package.json, the single source of truth (the Dockerfile's ARG
      # PNPM_VERSION mirrors it via Renovate).
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5
        with:
          fail-on-severity: high

      - name: Lint and format check
        run: pnpm lint

      - name: Test
        run: pnpm test

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Build updater signature verifier
        run: cargo build --locked --manifest-path scripts/verify-updater/Cargo.toml
      - name: Test release safety checks
        run: pnpm test:release

      - name: Coverage snapshot
        run: pnpm test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: node-v8-coverage
          path: coverage
          if-no-files-found: ignore

      - name: Typecheck
        run: pnpm typecheck

      - name: Check locale parity
        run: pnpm lint:i18n

      - name: Test iOS import helper
        run: pnpm test:ios-import-helper

      - name: Install Tauri Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # tauri-build (run by `cargo test` via the build script) reads
      # `src-tauri/resources/standalone.tar` and panics if it doesn't
      # exist. The real tarball is the standalone Next.js bundle and
      # is only produced by `pnpm build:standalone` (~30s). For test
      # purposes a 0-byte placeholder is enough — cargo's resource-
      # path validator only does Path::exists().
      - name: Stub standalone.tar for tauri-build
        run: node scripts/ensure-standalone-stub.mjs

      - name: Test Tauri Rust helpers
        run: pnpm test:tauri

      - name: Audit production dependency tree
        # pnpm audit equivalent of `npm audit --omit=optional`.
        run: pnpm audit --prod

      - name: Validate Docker Compose files
        env:
          AUDITOR_ADMIN_TOKEN: privacytracker-ci-test-token
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f deploy/caddy/compose.yaml config >/dev/null
          docker compose -f deploy/traefik/compose.yaml config >/dev/null

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        # pnpm exec replaces npx for resolving binaries from node_modules.
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser E2E
        run: pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore

  storybook:
    # Non-blocking visual-workshop build. Catches story compilation
    # regressions without holding up unrelated PRs. Promote to a hard
    # gate (`continue-on-error: false`) once the story set stabilises.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: storybook-static
          path: storybook-static
          if-no-files-found: ignore

  rust-check:
    # Compile-only sanity check for the Tauri desktop shell. CodeQL used
    # to give us this signal indirectly while it ran in `build-mode:
    # manual`, but the Rust extractor only supports `build-mode: none`
    # now (see .github/workflows/codeql.yml), so a Rust compile error
    # would otherwise reach a release build before anyone noticed.
    # `cargo check` is much faster than a full `cargo build` (no codegen,
    # no link) so this job adds well under a minute on the standard runner
    # and catches the common regressions: missing imports, type-error
    # changes after a tauri version bump, mismatched crate features.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri Linux build dependencies
        # Tauri's webview backend on Linux links against gtk + webkit2gtk;
        # these packages are needed even for `cargo check` because the
        # build script runs the linker's metadata pass over the system
        # libraries to validate the tauri crate's link-search paths.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        # Needed only to run the `ensure-standalone-stub.mjs` placeholder
        # script below. Doesn't need pnpm or a node_modules install.
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version-file: '.nvmrc'

      # See the matching note in the `quality` job — tauri-build needs
      # `resources/standalone.tar` to exist before `cargo check` will
      # even start compiling, so write a 0-byte placeholder.
      - name: Stub standalone.tar for tauri-build
        run: node scripts/ensure-standalone-stub.mjs

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable as of 2026-05

      - name: Cache cargo registry + target
        # Saves the cargo download index, the compiled crate cache, and
        # the target dir between runs. Keyed on the lockfile so a tauri
        # bump invalidates cleanly. Without this each PR re-downloads
        # ~600 transitive crates and the job takes ~3× longer.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      - name: Cargo check
        # `--no-default-features` matches the BeforeDevCommand /
        # macOS-release invocation. Defaults turn on `tauri/devtools`
        # which we don't ship in release.
        run: cargo check --manifest-path src-tauri/Cargo.toml --no-default-features --locked

  core-parity:
    # Rust-core Phase 1 gate. Compiles the standalone core/ crate, runs its
    # unit tests, and — the real check — proves the Rust migrator reproduces
    # lib/db.ts's schema + migrations byte-for-byte via a Node-vs-Rust
    # schema-dump diff (scripts/parity/schema-parity.mjs). Unlike rust-check,
    # core/ has no Tauri/webkit deps, so no apt webview packages and no
    # standalone stub are needed — just Rust + Node (the harness drives
    # better-sqlite3 + tsx to run the TypeScript side).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Parity manifest classifies every route
        # scripts/parity/manifest.mjs must list every app/api/**/route.ts.
        # parity-diff.mjs enforces that at startup, but the Rust read gate
        # (read-parity.mjs) runs it with --skip-coverage and nothing else in
        # CI walked the tree, so /api/device-scope shipped unclassified for a
        # day. Same walk, no servers (scripts/parity/manifest-check.mjs).
        run: pnpm parity:manifest

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable as of 2026-05

      - name: Cache cargo registry + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-core-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-core-

      - name: diffSnapshots fixture is current
        # Re-derives core/tests/fixtures/diff-cases.json by RUNNING the real
        # lib/changelog.ts diffSnapshots. A diff here means the Node function
        # changed and the Rust port in core/src/server/diff.rs has not been
        # updated to match — which nothing else would catch, because the
        # read-parity differ compares only seeded apps and every one of those
        # diffs to nothing.
        run: |
          pnpm parity:diff-cases
          git diff --exit-code -- core/tests/fixtures/diff-cases.json \
            || { echo "::error::diffSnapshots changed but core/tests/fixtures/diff-cases.json was not regenerated — run \`just parity-diff-cases\` and port the change to core/src/server/diff.rs"; exit 1; }

      - name: Settings-read rule tables + fixture are current
        # Re-derives core/src/server/flag_rules.json (the feature-flag rule
        # tables the Rust server include_str!s) and
        # core/tests/fixtures/settings-cases.json by RUNNING the real
        # resolver, reconcileLayout/matchDashboardPreset and maskWebhookUrl.
        # A diff here means a rule table or one of those functions changed in
        # Node and the Rust side has not been regenerated / ported to match.
        run: |
          pnpm parity:settings-cases
          git diff --exit-code -- core/src/server/flag_rules.json core/tests/fixtures/settings-cases.json \
            || { echo "::error::the feature-flag rules, dashboard-layout helpers or maskWebhookUrl changed but the generated Rust inputs were not regenerated — run \`just parity-settings-cases\`, commit both files, and port any resolver change to core/src/server/flags.rs"; exit 1; }

      - name: Stats-read metadata and fixed-clock oracle are current
        run: |
          node --conditions=react-server --import tsx core/scripts/extract-stats-cases.mjs
          git diff --exit-code -- core/src/server/stats_meta.json core/tests/fixtures/stats-cases.json

      - name: Device GET status and raw-body oracle is current
        run: |
          node --conditions=react-server --import tsx core/scripts/extract-devices-cases.mjs
          git diff --exit-code -- core/tests/fixtures/devices-cases.json

      - name: User-content metadata and fixed-clock route oracle are current
        run: |
          node --conditions=react-server --import tsx core/scripts/extract-content-meta.mjs
          node --conditions=react-server --import tsx core/scripts/extract-content-cases.mjs
          git diff --exit-code -- core/src/server/content_meta.json core/tests/fixtures/content-cases.json

      - name: Operational GET and filename-date oracle is current
        run: |
          node --conditions=react-server --import tsx core/scripts/extract-operations-cases.mjs
          git diff --exit-code -- core/tests/fixtures/operations-cases.json

      - name: Outbound transport and discovery route oracles are current
        run: |
          node --conditions=react-server --import tsx core/scripts/extract-outbound-cases.mjs
          node --conditions=react-server --import tsx core/scripts/extract-discovery-cases.mjs
          git diff --exit-code -- core/tests/fixtures/outbound-cases.json core/tests/fixtures/discovery-cases.json

      - name: Scrape page-parse oracle is current
        # Runs the real fetchAndParseApp over synthetic App Store pages and
        # records what the page alone determined (rows + snapshot_json, or
        # the error). A diff means the Node parser changed and
        # core/src/scrape/ has not been ported to match.
        run: |
          node --conditions=react-server --import tsx core/scripts/extract-scrape-cases.mjs
          git diff --exit-code -- core/tests/fixtures/scrape-cases.json

      - name: Scrape persist oracle is current
        # Runs the real fetchAndParseApp end to end (stubbed fetch, inline
        # bulk write, frozen clock, counted ids) and records every write it
        # makes plus the rows it leaves. A diff means the Node persist path
        # changed and core/src/scrape/persist.rs has not been ported to match.
        run: |
          node --conditions=react-server --import tsx core/scripts/extract-persist-cases.mjs
          git diff --exit-code -- core/tests/fixtures/persist-cases.json

      - name: Scrape fetch oracle is current
        # Runs the real fetchAndParseApp and scrapeInitialUrls with the raw
        # fetch stubbed by recorded replies and records every raw fetch, every
        # write and every touched table. A diff means the Node fetch layer
        # changed and core/src/scrape/fetch.rs has not been ported to match.
        run: |
          node --conditions=react-server --import tsx core/scripts/extract-fetch-cases.mjs
          git diff --exit-code -- core/tests/fixtures/fetch-cases.json

      - name: Scrape search oracle is current
        # Runs the real searchAppsByName and lookupAppsByBundleId with the raw
        # fetch stubbed by recorded iTunes replies and records every raw fetch,
        # every write and the batch returned. A diff means the Node search
        # layer changed and core/src/scrape/search.rs has not been ported.
        run: |
          node --conditions=react-server --import tsx core/scripts/extract-search-cases.mjs
          git diff --exit-code -- core/tests/fixtures/search-cases.json

      - name: Scrape history oracle is current
        # Runs the real importAppHistory with archive.org stubbed by recorded
        # CDX, availability, replay and Save Page Now replies and records
        # every raw fetch, every write with its transaction markers, the
        # snapshot rows and the result. A diff means the Node historical
        # import changed and core/src/scrape/history.rs has not been ported.
        run: |
          node --conditions=react-server --import tsx core/scripts/extract-history-cases.mjs
          git diff --exit-code -- core/tests/fixtures/history-cases.json

      - name: Settings write-route oracle is current
        # Runs the real POST/PUT/DELETE handlers of the twenty settings-style
        # writes with a frozen clock and counted ids and records every
        # request, every write with its transaction markers, the touched
        # tables and the wire response. A diff means a Node write handler
        # changed and core/src/server/writes.rs has not been ported.
        run: |
          node --conditions=react-server --import tsx core/scripts/extract-writes-cases.mjs
          git diff --exit-code -- core/tests/fixtures/writes-cases.json

      - name: Library write-route oracle is current
        # Runs the real handlers of the twenty-three library writes —
        # annotations, verdicts, shortlist, review actions, notifications,
        # user tasks, queue sessions, devices, the device scope and manual
        # apps — with foreign keys on, a frozen clock and counted ids, and
        # records every request, write, touched table and wire response. A
        # diff means a Node write handler changed and
        # core/src/server/library_writes.rs has not been ported.
        run: |
          node --conditions=react-server --import tsx core/scripts/extract-library-cases.mjs
          git diff --exit-code -- core/tests/fixtures/library-cases.json

      - name: Import write-route oracle is current
        # Runs the real handlers of the twelve import-pipeline writes — the
        # import session and its items, the item update, the queue drain,
        # the completion, the per-item retry and match change, the iTunes
        # search, the App Store scrape and the per-app Wayback import — with
        # the network canned per case, foreign keys on, a frozen clock and
        # counted ids, and records every request, raw fetch, write, touched
        # table and wire response. A diff means a Node handler on that path
        # changed and core/src/server/imports_writes.rs has not been ported.
        run: |
          node --conditions=react-server --import tsx core/scripts/extract-imports-cases.mjs
          git diff --exit-code -- core/tests/fixtures/imports-cases.json

      - name: Runner oracle is current
        # Runs the real bulk App Store sync through the sync trigger route,
        # the scheduler's check and the boot-time resume (the startup hook's
        # own closures, captured from register()), the boot lock clears, the
        # import-queue drain tick, the sync stop and the rate-limit and app
        # deletes — network canned per case, foreign keys on, frozen clock —
        # and records every request, fetch, write, touched table and wire
        # response. A diff means a Node runner or route changed and
        # core/src/server/sync_runner.rs or runner_writes.rs has not been
        # ported.
        run: |
          node --conditions=react-server --import tsx core/scripts/extract-runners-cases.mjs
          git diff --exit-code -- core/tests/fixtures/runners-cases.json

      - name: Wayback runner oracle is current
        # Runs the real bulk Wayback import through POST (buffered and
        # streamed), PATCH (pause, cancel, resume) and DELETE, and the
        # startup hook's own 8 s resume, with mid-run controls issued from
        # the network stub — network canned per case, foreign keys on,
        # frozen clock — and records every request, fetch, write, touched
        # table and wire response (the NDJSON frames included). A diff means
        # a Node runner or route changed and core/src/server/wayback_runner.rs
        # has not been ported.
        run: |
          node --conditions=react-server --import tsx core/scripts/extract-wayback-runner-cases.mjs
          git diff --exit-code -- core/tests/fixtures/wayback-runner-cases.json

      - name: Maintenance oracle is current
        # Runs the real health check and self-heal (the route and the
        # startup hook's own 60 s closure), the diagnostics writes, the
        # admin-token login and logout, the CSP report ingest, the dev
        # helpers and the two teardowns — foreign keys on, frozen clock,
        # the in-process rings and counters reset per case — and records
        # every request, write, touched table, CSP ring entry and wire
        # response. A diff means a Node route or lib/health-check.ts
        # changed and core/src/server/maintenance_writes.rs or
        # health_check.rs has not been ported.
        run: |
          node --conditions=react-server --import tsx core/scripts/extract-maintenance-cases.mjs
          git diff --exit-code -- core/tests/fixtures/maintenance-cases.json

      - name: Core crate tests
        run: cargo test --locked --manifest-path core/Cargo.toml

      - name: Schema parity vs lib/db.ts
        # Builds pt-core (via the parity:schema script) then diffs a
        # Rust-migrated database against a TypeScript-migrated one on fresh,
        # legacy and current+state fixtures. Fails on any schema divergence.
        run: pnpm parity:schema

  container-smoke:
    # Compose also interpolates required variables during cleanup.
    env:
      AUDITOR_ADMIN_TOKEN: ci-smoke-token
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t privacytracker-smoke .

      - name: Scan final runtime image
        # Export the image so the scanner never needs the Docker socket.
        run: |
          mkdir -p "$RUNNER_TEMP/runtime-scan"
          docker save privacytracker-smoke -o "$RUNNER_TEMP/runtime-scan/image.tar"
          docker run --rm \
            -v "$RUNNER_TEMP/runtime-scan:/scan" \
            ghcr.io/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --input /scan/image.tar --cache-dir /scan/cache \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            --format json --output /scan/results.json

      - name: Upload runtime vulnerability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: runtime-vulnerability-report
          path: ${{ runner.temp }}/runtime-scan/results.json
          if-no-files-found: ignore

      - name: Run Docker container
        run: |
          docker run -d --rm \
            --name privacytracker-smoke \
            -p 127.0.0.1:3000:3000 \
            privacytracker-smoke

      - name: Wait for healthcheck
        run: |
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/api/ready; then
              echo "Container is healthy"
              exit 0
            fi
            echo "Waiting for container health (${attempt}/40)…"
            docker logs --tail=50 privacytracker-smoke || true
            sleep 3
          done
          docker logs privacytracker-smoke || true
          exit 1

      - name: Stop Docker container
        if: always()
        run: docker stop privacytracker-smoke || true

      - name: Smoke Caddy reverse proxy
        env:
          PRIVACYTRACKER_IMAGE: privacytracker-smoke
          PRIVACYTRACKER_HOST: privacytracker.localhost
          AUDITOR_ADMIN_TOKEN: ci-smoke-token
        run: |
          docker compose -f deploy/caddy/compose.yaml up -d
          for attempt in {1..40}; do
            if curl -kfsS --resolve privacytracker.localhost:443:127.0.0.1 https://privacytracker.localhost/api/ready; then
              echo "Caddy proxy is healthy"
              exit 0
            fi
            echo "Waiting for Caddy proxy (${attempt}/40)…"
            docker compose -f deploy/caddy/compose.yaml logs --tail=80 || true
            sleep 3
          done
          docker compose -f deploy/caddy/compose.yaml logs || true
          exit 1

      - name: Stop Caddy reverse proxy
        if: always()
        run: docker compose -f deploy/caddy/compose.yaml down -v || true

      - name: Smoke Traefik reverse proxy
        env:
          PRIVACYTRACKER_IMAGE: privacytracker-smoke
          PRIVACYTRACKER_HOST: privacytracker.localhost
          AUDITOR_ADMIN_TOKEN: ci-smoke-token
        run: |
          docker compose -f deploy/traefik/compose.yaml up -d
          for attempt in {1..40}; do
            if curl -fsS -H "Host: privacytracker.localhost" http://127.0.0.1/api/ready; then
              echo "Traefik proxy is healthy"
              exit 0
            fi
            echo "Waiting for Traefik proxy (${attempt}/40)…"
            docker compose -f deploy/traefik/compose.yaml logs --tail=80 || true
            sleep 3
          done
          docker compose -f deploy/traefik/compose.yaml logs || true
          exit 1

      - name: Stop Traefik reverse proxy
        if: always()
        run: docker compose -f deploy/traefik/compose.yaml down -v || true

  compose-smoke:
    env:
      AUDITOR_ADMIN_TOKEN: privacytracker-ci-test-token
    # Exercises the *documented* `docker compose up --build -d` path that
    # container-smoke (plain `docker run`, no volume) never touches. This is the
    # only leg that would have caught:
    #   - public/ missing from the runtime image → 404 on /fonts/* + /brand-icon.png
    #   - the bind-mount ownership trap → uid 100 can't create privacy.db on a
    #     fresh Linux host (root-owned auto-created bind source) → /api/ready never
    #     goes green. macOS Docker Desktop hides this by uid-mapping bind mounts.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # --- Leg A: the documented default (named volume) ---
      - name: Start root compose (named volume)
        run: docker compose -f docker-compose.yml up --build -d

      - name: Wait for compose healthcheck (named volume)
        run: |
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/api/ready; then
              echo "Named-volume container is healthy"
              exit 0
            fi
            echo "Waiting for container health (${attempt}/40)…"
            docker compose -f docker-compose.yml logs --tail=50 || true
            sleep 3
          done
          docker compose -f docker-compose.yml logs || true
          exit 1

      - name: Assert static assets are served (named volume)
        # These three curls fail (404 → curl -f exits non-zero) if public/ is
        # missing from the runtime image. /api/ready alone never exercises them.
        run: |
          set -euxo pipefail
          curl -fsS --max-time 10 -o /dev/null http://127.0.0.1:3000/api/ready
          curl -fsS --max-time 10 -o /dev/null http://127.0.0.1:3000/fonts/InterVariable.woff2
          curl -fsS --max-time 10 -o /dev/null http://127.0.0.1:3000/brand-icon.png

      - name: Assert private data requires authentication inside Docker
        run: |
          docker compose exec -T web node --input-type=module -e '
            const url = "http://127.0.0.1:3000/api/apps";
            const anonymous = await fetch(url, {headers: {Host: "localhost:3000"}});
            if (anonymous.status !== 401) throw new Error("Unauthenticated private read allowed");
            const signedIn = await fetch(url, {headers: {"x-auditor-admin-token": process.env.AUDITOR_ADMIN_TOKEN}});
            if (signedIn.status !== 200) throw new Error("Authenticated private read failed");
          '

      - name: Stop root compose (named volume)
        if: always()
        run: docker compose -f docker-compose.yml down -v || true

      # --- Leg B: the bind-mount opt-in, with an engine-created bind source ---
      - name: Start root compose (bind mount + documented chown)
        run: |
          # Reproduce a fresh Linux host: no ./data dir yet. The documented
          # one-time pre-step is `mkdir -p data && sudo chown 100:101 data`
          # (the container's audit user is uid 100 / gid 101). Without the
          # chown this start fails with SQLITE_CANTOPEN — that's the bug.
          sudo rm -rf data
          mkdir -p data && sudo chown 100:101 data
          docker compose -f docker-compose.yml -f docker-compose.bind-mount.yml up --build -d

      - name: Wait for compose healthcheck (bind mount)
        run: |
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/api/ready; then
              echo "Bind-mount container is healthy"
              exit 0
            fi
            echo "Waiting for container health (${attempt}/40)…"
            docker compose -f docker-compose.yml -f docker-compose.bind-mount.yml logs --tail=50 || true
            sleep 3
          done
          docker compose -f docker-compose.yml -f docker-compose.bind-mount.yml logs || true
          exit 1

      - name: Assert static assets + DB written to host (bind mount)
        run: |
          set -euxo pipefail
          curl -fsS --max-time 10 -o /dev/null http://127.0.0.1:3000/api/ready
          curl -fsS --max-time 10 -o /dev/null http://127.0.0.1:3000/fonts/InterVariable.woff2
          curl -fsS --max-time 10 -o /dev/null http://127.0.0.1:3000/brand-icon.png
          # Proves uid 100 could actually write through the bind mount — the
          # core of BUG 2. /api/ready only goes green once the data dir is
          # writable, but assert the file exists too for an unambiguous signal.
          # sudo because the app chmods data/ to 0700 (owned by uid 100) on
          # open — see tightenDataPermissions in lib/db.ts — so the runner
          # user can no longer stat inside it. That lockdown is the intended
          # behaviour, and this assertion must not depend on it being absent.
          sudo test -f data/privacy.db

      - name: Stop root compose (bind mount)
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.bind-mount.yml down -v || true
          sudo rm -rf data || true
